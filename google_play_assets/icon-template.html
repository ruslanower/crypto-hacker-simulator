<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at center, #0f241a 0%, #050d09 70%, #020504 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      position: relative;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 255, 102, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .circle-glow {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.25) 0%, rgba(0, 240, 255, 0.05) 50%, transparent 70%);
      filter: blur(20px);
    }
    .border-ring {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 255, 102, 0.4);
    }
    .inner-ring {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
    }
    .skull-svg {
      width: 210px;
      height: 210px;
      filter: drop-shadow(0 0 20px #00ff66) drop-shadow(0 0 45px rgba(0, 255, 102, 0.6));
      z-index: 2;
    }
    .title-box {
      z-index: 2;
      margin-top: 18px;
      text-align: center;
    }
    .title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #00ff66;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.8), 0 0 30px rgba(0, 255, 102, 0.5);
    }
    .subtitle {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 7px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
      margin-top: 2px;
    }
    .corner-tl { position: absolute; top: 24px; left: 24px; width: 32px; height: 32px; border-top: 3px solid #00ff66; border-left: 3px solid #00ff66; }
    .corner-tr { position: absolute; top: 24px; right: 24px; width: 32px; height: 32px; border-top: 3px solid #00ff66; border-right: 3px solid #00ff66; }
    .corner-bl { position: absolute; bottom: 24px; left: 24px; width: 32px; height: 32px; border-bottom: 3px solid #00ff66; border-left: 3px solid #00ff66; }
    .corner-br { position: absolute; bottom: 24px; right: 24px; width: 32px; height: 32px; border-bottom: 3px solid #00ff66; border-right: 3px solid #00ff66; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="circle-glow"></div>
  <div class="border-ring"></div>
  <div class="inner-ring"></div>
  
  <div class="corner-tl"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <!-- Cyber Skull SVG -->
  <svg class="skull-svg" viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m12.5 17-.5-1-.5 1h1z" fill="#00ff66"/>
    <path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z" fill="#0a1f14"/>
    <circle cx="9" cy="12" r="2.2" fill="#00f0ff" stroke="#00f0ff"/>
    <circle cx="15" cy="12" r="2.2" fill="#00f0ff" stroke="#00f0ff"/>
    <path d="M8 20h8"/>
    <path d="M10 20v2"/>
    <path d="M14 20v2"/>
  </svg>

  <div class="title-box">
    <div class="title">CRYPTO</div>
    <div class="subtitle">HACKER SIM</div>
  </div>
</body>
</html>
