<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: radial-gradient(ellipse at 70% 50%, #0d2e20 0%, #06170f 50%, #020704 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      position: relative;
      color: #e0f2e9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 255, 102, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .ambient-glow-left {
      position: absolute;
      left: 100px;
      top: 100px;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.25) 0%, transparent 70%);
      filter: blur(40px);
    }
    .ambient-glow-right {
      position: absolute;
      right: 120px;
      top: 60px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, transparent 70%);
      filter: blur(50px);
    }
    .left-content {
      z-index: 2;
      max-width: 540px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(0, 255, 102, 0.12);
      border: 1px solid rgba(0, 255, 102, 0.4);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #00ff66;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .title-main {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
    }
    .title-main span {
      color: #00ff66;
      display: block;
    }
    .subtitle {
      font-size: 16px;
      color: #8aa89b;
      margin-top: 14px;
      line-height: 1.5;
    }
    .tags {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    .tag {
      padding: 6px 12px;
      background: #0f1c16;
      border: 1px solid #1f3329;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1px;
    }
    .right-graphic {
      z-index: 2;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card-preview {
      width: 290px;
      background: rgba(15, 23, 19, 0.9);
      border: 1px solid #00ff66;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.35);
      backdrop-filter: blur(8px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #8aa89b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card-balance {
      font-size: 32px;
      font-weight: 900;
      color: #00ff66;
      margin-top: 6px;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
    }
    .card-rate {
      font-size: 13px;
      color: #00f0ff;
      font-weight: 700;
      margin-top: 2px;
    }
    .mini-tap-circle {
      margin-top: 16px;
      height: 80px;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.2) 0%, transparent 70%);
      border: 2px dashed rgba(0, 255, 102, 0.6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #00ff66;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="ambient-glow-left"></div>
  <div class="ambient-glow-right"></div>

  <div class="left-content">
    <div class="badge">● OFFLINE CYBER SIMULATOR</div>
    <div class="title-main">
      CRYPTO
      <span>HACKER SIM</span>
    </div>
    <div class="subtitle">
      Build botnets, mine digital cash, crack DeFi vaults & evade the cyber police in this tactical idle clicker.
    </div>
    <div class="tags">
      <div class="tag">⚡ TAP MULTIPLIER</div>
      <div class="tag">❄️ RIG COOLING</div>
      <div class="tag">🌪️ TORNADO MIXER</div>
      <div class="tag">📈 DEX TRADING</div>
    </div>
  </div>

  <div class="right-graphic">
    <div class="card-preview">
      <div class="card-header">
        <span>CLEAN CASH</span>
        <span>RANK 15/15</span>
      </div>
      <div class="card-balance">$14,892,400</div>
      <div class="card-rate">+ $425,000/s · NITROGEN COOLED</div>
      <div class="mini-tap-circle">
        ⚡ TAP TO MINE
      </div>
    </div>
  </div>
</body>
</html>
